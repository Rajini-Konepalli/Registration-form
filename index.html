<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>User Registration Form</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 30px;
      background: #f0f2f5;
    }
    form {
      background: #fff;
      padding: 20px;
      border-radius: 10px;
      max-width: 500px;
      margin: auto;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    label {
      display: block;
      margin-top: 15px;
    }
    input, select {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      border-radius: 5px;
      border: 1px solid #ccc;
    }
    .strength {
      margin-top: 5px;
      height: 8px;
      border-radius: 4px;
    }
    .strength.weak { background: red; width: 33%; }
    .strength.medium { background: orange; width: 66%; }
    .strength.strong { background: green; width: 100%; }
    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    button {
      margin-top: 20px;
      padding: 12px;
      width: 100%;
      background: #007bff;
      border: none;
      color: white;
      border-radius: 5px;
      cursor: pointer;
    }
    button:hover {
      background: #0056b3;
    }
  </style>
</head>
<body>

<form>
  <h2>Registration Form</h2>

  <label>Full Name</label>
  <input type="text" placeholder="First Name Last Name" required>

  <label>Email Address</label>
  <input type="email" required>

  <label>Password</label>
  <input type="password" id="password" required oninput="checkStrength()">
  
  <!-- Password Strength Bar -->
  <div id="strengthBar" class="strength"></div>

  <label>Confirm Password</label>
  <input type="password" required>

  <label>Date of Birth</label>
  <input type="date" required>

  <label>Gender</label>
  <select required>
    <option value="">Select</option>
    <option value="male">Male</option>
    <option value="female">Female</option>
    <option value="other">Other</option>
  </select>

  <label>Profile Picture</label>
  <input type="file" accept="image/*">

  <label class="checkbox-label">
    <input type="checkbox" required>
    I accept the Terms and Conditions
  </label>

  <button type="submit">Register</button>
</form>

<script>
  function checkStrength() {
    const password = document.getElementById("password").value;
    const bar = document.getElementById("strengthBar");

    let strength = 0;

    if (password.length >= 6) strength++;
    if (/[A-Z]/.test(password)) strength++;
    if (/[0-9]/.test(password)) strength++;
    if (/[@$!%*?&]/.test(password)) strength++;

    bar.className = "strength"; // reset

    if (strength === 0) {
      bar.style.width = "0";
    } else if (strength <= 1) {
      bar.classList.add("weak");
    } else if (strength === 2 || strength === 3) {
      bar.classList.add("medium");
    } else {
      bar.classList.add("strong");
    }
  }
</script>

</body>
</html>
